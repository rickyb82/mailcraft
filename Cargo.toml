[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/rickyb82/mailcraft"

[workspace.dependencies]
mailcraft-core = { path = "crates/core", version = "0.1.0" }
mailcraft-net = { path = "crates/net", version = "0.1.0" }
mailcraft-engine = { path = "crates/engine", version = "0.1.0" }
mailcraft-mcp = { path = "crates/mcp", version = "0.1.0" }
mailcraft-ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "ring"] }
sys-locale = "0.3"
rfd = "0.17"

egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
